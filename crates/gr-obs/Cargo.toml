[package]
name = "gr-obs"
description = "Recorder implementation that drives OBS Studio through obs-websocket v5."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
log.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
gr-game-league = { path = "../../games/league" }
gr-mock-league = { path = "../gr-mock-league" }
chrono.workspace = true
