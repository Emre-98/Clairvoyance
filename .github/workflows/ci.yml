# Quick checks on every push to main and on pull requests.
# Linux: portable crates (tests, clippy, rustfmt) + UI. Windows: the whole workspace, including the
# recorder pipeline and the Tauri app, which otherwise would only be compiled by the release build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust tests (core, games, recorder muxer)
        run: cargo test -p cv-core -p cv-game-league -p cv-game-cs2 -p cv-capture
      - name: Clippy (portable crates)
        run: cargo clippy -p cv-core -p cv-game-league -p cv-game-cs2 -p cv-capture -p cv-mock-league --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI type check and build
        run: |
          npm ci --prefix ui
          npm --prefix ui run check
          npm --prefix ui run build
      - name: UI unit tests (ability bubbles layout + trail timing, timeline zoom / frame stepping, player controls fitting)
        run: node --experimental-strip-types --test ui/tests/bubbles.unit.test.ts ui/tests/timeline.unit.test.ts ui/tests/controlsfit.unit.test.ts

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The Tauri app embeds the built UI, so it must exist before the app compiles.
      - name: UI build
        run: |
          npm ci --prefix ui
          npm --prefix ui run build
      - name: Clippy (whole workspace, Windows code included)
        run: cargo clippy --workspace --all-targets -- -D warnings
