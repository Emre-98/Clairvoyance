[workspace]
resolver = "3"
members = ["crates/cv-core", "crates/cv-capture", "crates/cv-mock-league", "games/league", "games/cs2", "app"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
cv-core = { path = "crates/cv-core" }
cv-game-league = { path = "games/league" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
